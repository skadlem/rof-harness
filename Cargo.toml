[package]
name = "rof"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/skadlem/rof-harness"
description = "A general coding-agent harness: a bounded implementer/reviewer loop with a live terminal console, replayable evidence, and a measured judge-free oracle."

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
ansi-to-tui = "8.0.1"
