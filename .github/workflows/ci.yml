name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: no stale references in tracked files
        run: |
          if git grep -n "research/\|AGENTS\.md\|DECISIONS\.md\|~/rof-harness" -- . ':!.github/workflows/ci.yml'; then
            echo "forbidden reference found in tracked files" >&2
            exit 1
          fi
